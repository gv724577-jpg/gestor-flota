name: Build Portable Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller matplotlib pandas openpyxl

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --exclude-module pyarrow gemini-code-1790432984483.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GestorFlota_Ejecutable
        path: dist/gemini-code-1790432984483/
